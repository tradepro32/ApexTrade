<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ApexTrade | Demo Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #07111f;
            color: white;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid #1e3045;
            background: #081522;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #16c784;
        }

        .demo {
            color: #16c784;
            font-size: 14px;
            font-weight: bold;
        }

        .container {
            width: 88%;
            max-width: 1400px;
            margin: 35px auto;
        }

        .top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #0d1b2a;
            border: 1px solid #21364d;
            border-radius: 12px;
            padding: 22px;
        }

        .card small {
            color: #94a3b8;
        }

        .card h2 {
            margin-top: 10px;
            font-size: 28px;
        }

        .green {
            color: #16c784;
        }

        .red {
            color: #ea3943;
        }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .markets {
            background: #0d1b2a;
            border: 1px solid #21364d;
            border-radius: 12px;
            padding: 25px;
        }

        .markets h2 {
            margin-bottom: 20px;
        }

        .market {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid #203246;
        }

        .market:last-child {
            border-bottom: none;
        }

        .symbol {
            font-weight: bold;
        }

        .price {
            color: #dbeafe;
        }

        button {
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 6px;
        }

        .buy {
            background: #16c784;
            color: #04100b;
        }

        .sell {
            background: #ea3943;
            color: white;
        }

        .order {
            background: #0d1b2a;
            border: 1px solid #21364d;
            border-radius: 12px;
            padding: 25px;
        }

        .order h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #081522;
            border: 1px solid #30465d;
            border-radius: 7px;
            color: white;
        }

        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .trade-buttons button {
            margin: 0;
            padding: 13px;
        }

        .positions {
            margin-top: 30px;
            background: #0d1b2a;
            border: 1px solid #21364d;
            border-radius: 12px;
            padding: 25px;
        }

        .positions h2 {
            margin-bottom: 20px;
        }

        .empty {
            color: #64748b;
            padding: 20px 0;
        }

        #message {
            margin-top: 18px;
            color: #16c784;
            min-height: 20px;
        }

        @media (max-width: 900px) {

            .top {
                grid-template-columns: 1fr;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            .market {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Apex<span>Trade</span>
    </div>

    <div class="demo">
        DEMO ACCOUNT
    </div>

</header>


<div class="container">

    <div class="top">

        <div class="card">
            <small>Available Balance</small>
            <h2 id="balance">$10,000.00</h2>
        </div>

        <div class="card">
            <small>Portfolio Value</small>
            <h2 id="portfolio">$10,000.00</h2>
        </div>

        <div class="card">
            <small>Today's P&L</small>
            <h2 class="green" id="pnl">$0.00</h2>
        </div>

    </div>


    <div class="layout">

        <div class="markets">

            <h2>Markets</h2>

            <div class="market">

                <div>
                    <div class="symbol">BTC/USD</div>
                    <div class="price">$67,420.00</div>
                </div>

                <div>
                    <span class="green">+2.41%</span>

                    <button
                        class="buy"
                        onclick="quickTrade('BTC/USD','buy')">
                        Buy
                    </button>

                    <button
                        class="sell"
                        onclick="quickTrade('BTC/USD','sell')">
                        Sell
                    </button>
                </div>

            </div>


            <div class="market">

                <div>
                    <div class="symbol">ETH/USD</div>
                    <div class="price">$2,540.00</div>
                </div>

                <div>
                    <span class="green">+1.87%</span>

                    <button
                        class="buy"
                        onclick="quickTrade('ETH/USD','buy')">
                        Buy
                    </button>

                    <button
                        class="sell"
                        onclick="quickTrade('ETH/USD','sell')">
                        Sell
                    </button>
                </div>

            </div>


            <div class="market">

                <div>
                    <div class="symbol">EUR/USD</div>
                    <div class="price">1.1724</div>
                </div>

                <div>
                    <span class="green">+0.62%</span>

                    <button
                        class="buy"
                        onclick="quickTrade('EUR/USD','buy')">
                        Buy
                    </button>

                    <button
                        class="sell"
                        onclick="quickTrade('EUR/USD','sell')">
                        Sell
                    </button>
                </div>

            </div>


            <div class="market">

                <div>
                    <div class="symbol">GOLD</div>
                    <div class="price">$3,752.40</div>
                </div>

                <div>
                    <span class="red">-0.34%</span>

                    <button
                        class="buy"
                        onclick="quickTrade('GOLD','buy')">
                        Buy
                    </button>

                    <button
                        class="sell"
                        onclick="quickTrade('GOLD','sell')">
                        Sell
                    </button>
                </div>

            </div>

        </div>


        <div class="order">

            <h2>Place Demo Order</h2>

            <label>Asset</label>

            <select id="asset">

                <option>BTC/USD</option>
                <option>ETH/USD</option>
                <option>EUR/USD</option>
                <option>GOLD</option>

            </select>


            <label>Amount (USD)</label>

            <input
                id="amount"
                type="number"
                value="100"
                min="1">


            <label>Risk Control</label>

            <select>

                <option>Standard</option>
                <option>Low Risk</option>
                <option>High Risk</option>

            </select>


            <div class="trade-buttons">

                <button
                    class="buy"
                    onclick="placeOrder('buy')">
                    BUY
                </button>

                <button
                    class="sell"
                    onclick="placeOrder('sell')">
                    SELL
                </button>

            </div>

            <div id="message"></div>

        </div>

    </div>


    <div class="positions">

        <h2>Open Positions</h2>

        <div id="positions">

            <div class="empty">
                No open demo positions.
            </div>

        </div>

    </div>

</div>


<script>

    let balance = 10000;

    let positions = [];


    function updateBalance() {

        document.getElementById("balance").textContent =
            "$" + balance.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

        document.getElementById("portfolio").textContent =
            "$" + balance.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );
    }


    function placeOrder(type) {

        const asset =
            document.getElementById("asset").value;

        const amount =
            Number(document.getElementById("amount").value);

        if (!amount || amount <= 0) {

            showMessage(
                "Enter a valid trading amount.",
                "red"
            );

            return;
        }


        if (amount > balance) {

            showMessage(
                "Insufficient demo balance.",
                "red"
            );

            return;
        }


        balance -= amount;


        positions.push({

            asset: asset,

            type: type,

            amount: amount,

            time: new Date().toLocaleTimeString()

        });


        updateBalance();

        renderPositions();


        showMessage(
            type.toUpperCase() +
            " order placed for " +
            asset +
            " — $" +
            amount.toFixed(2),
            "green"
        );
    }


    function quickTrade(asset, type) {

        document.getElementById("asset").value =
            asset;

        document.getElementById("amount").value =
            100;

        placeOrder(type);
    }


    function renderPositions() {

        const container =
            document.getElementById("positions");


        if (positions.length === 0) {

            container.innerHTML =
                '<div class="empty">No open demo positions.</div>';

            return;
        }


        container.innerHTML = "";


        positions.forEach(function(position) {

            const row =
                document.createElement("div");

            row.className = "market";


            row.innerHTML = `

                <div>

                    <div class="symbol">
                        ${position.asset}
                    </div>

                    <small>
                        ${position.type.toUpperCase()}
                    </small>

                </div>


                <div>

                    $${position.amount.toFixed(2)}

                </div>


                <div>

                    ${position.time}

                </div>

            `;


            container.appendChild(row);

        });

    }


    function showMessage(message, type) {

        const element =
            document.getElementById("message");

        element.textContent = message;

        element.className =
            type === "red"
                ? "red"
                : "green";

    }


    updateBalance();

</script>

</body>
</html>
